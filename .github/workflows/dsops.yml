name: dsops

on:
  push:
    branches: [main]
    paths: ["devops-lib/**", ".github/workflows/dsops.yml"]
  pull_request:
    paths: ["devops-lib/**", ".github/workflows/dsops.yml"]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DSOPS_TEST_POSTGRES_DSN: postgresql://postgres:postgres@localhost:5432/postgres
    defaults:
      run:
        working-directory: devops-lib
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
      - run: pip install -e '.[dev]'
      - run: pytest -q
      - name: Example pipeline runs end to end
        run: dsops dag run examples/etl_pipeline.py:dag --param rows=300

  build:
    needs: test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: devops-lib
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: pip install build && python -m build
      - uses: actions/upload-artifact@v5
        with:
          name: dsops-dist
          path: devops-lib/dist/
