# Local stack: your app + Postgres + Redis (locks/idempotency) + Prometheus (scrapes /metrics).
#   docker compose -f templates/docker-compose.yml up --build
services:
  app:
    build:
      context: ..
      dockerfile: templates/Dockerfile
    environment:
      APP_REDIS__URL: redis://redis:6379/0
      APP_DB__DSN: postgresql://app:app@postgres:5432/warehouse
    ports: ["9100:9100"]
    depends_on:
      redis: { condition: service_started }
      postgres: { condition: service_healthy }

  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: app
      POSTGRES_PASSWORD: app
      POSTGRES_DB: warehouse
    ports: ["5432:5432"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U app -d warehouse"]
      interval: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    ports: ["6379:6379"]

  prometheus:
    image: prom/prometheus:v2.54.1
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
    ports: ["9090:9090"]
    depends_on: [app]
