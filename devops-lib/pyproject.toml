[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "dsops"
version = "0.1.0"
description = "DevOps toolkit for distributed systems and data engineering: resilience, config, observability, coordination and pipelines."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Yassine Hafez" }]
keywords = ["devops", "distributed-systems", "data-engineering", "etl", "resilience", "observability"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Operating System :: OS Independent",
    "Topic :: System :: Distributed Computing",
    "Topic :: Software Development :: Libraries",
]
# The core library is stdlib-only on purpose: it should drop into any project.
dependencies = []

[project.optional-dependencies]
yaml = ["pyyaml>=6"]
redis = ["redis>=5"]
postgres = ["psycopg[binary]>=3.1"]
all = ["pyyaml>=6", "redis>=5", "psycopg[binary]>=3.1"]
dev = ["pytest>=8", "pytest-asyncio>=0.23", "pyyaml>=6", "psycopg[binary]>=3.1"]

[project.scripts]
dsops = "dsops.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
